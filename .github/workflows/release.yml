# Release on a new version: when a push to main carries a toc "## Version:" that has no v<version> tag yet, this tags
# the commit and builds the release (BigWigs packager: the addon zip plus a GitHub Release with CHANGELOG.md).
# A pushed v* tag releases too. A version whose GitHub Release already exists is not released again.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a new version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^## Version:' RXPForeverTracker.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
            tag="v${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${tag}" -m "RXP ForeverTracker ${version}"
              git push origin "${tag}"
              echo "Tagged ${tag}."
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # a version is released once: skip it when its GitHub Release exists
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # BigWigs packager (the addon zip and a GitHub Release with CHANGELOG.md). Run as its script with the tag as the
      # ref: on a branch push the packager action itself would wait for a tag push instead of releasing.
      - name: Package and release
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # To upload to CurseForge too: add a CF_API_KEY repository secret and "## X-Curse-Project-ID: <id>" to the toc.
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          git checkout -q "refs/tags/${{ steps.version.outputs.tag }}"
          # the release notes: this version's CHANGELOG.md section (its "## <version>" heading up to the next one), then
          # the major release it belongs to ("## <major>.0", e.g. 1.0 for every 1.x); the repository keeps the whole history
          version=$(grep -m1 '^## Version:' RXPForeverTracker.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          major="${version%%.*}.0"
          section() {
            awk -v v="$1" '
              /^##? / { if (found) exit; split($0, w, " "); if (w[1] == "##" && (w[2] == v || w[2] == "v" v)) found = 1 }
              found { print }
            ' CHANGELOG.md
          }
          section "$version" > "${RUNNER_TEMP}/notes.md"
          if [ -s "${RUNNER_TEMP}/notes.md" ]; then
            if [ "$major" != "$version" ]; then
              section "$major" > "${RUNNER_TEMP}/major.md"
              if [ -s "${RUNNER_TEMP}/major.md" ]; then
                printf '\n---\n\n' >> "${RUNNER_TEMP}/notes.md"
                cat "${RUNNER_TEMP}/major.md" >> "${RUNNER_TEMP}/notes.md"
              fi
            fi
            cp "${RUNNER_TEMP}/notes.md" CHANGELOG.md
          else
            echo "::warning::No '## ${version}' section in CHANGELOG.md: the whole file is used."
          fi
          curl -sSfL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "${RUNNER_TEMP}/release.sh"
          GITHUB_REF="refs/tags/${{ steps.version.outputs.tag }}" GITHUB_REF_TYPE=tag \
            GITHUB_REF_NAME="${{ steps.version.outputs.tag }}" bash "${RUNNER_TEMP}/release.sh" \
            -n "RXPForeverTracker:{project-version}"   # the zip is always RXPForeverTracker.zip (label: the version)
